[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Pinned 2026-11-21: latest stable release older than two weeks (0.8.39 was released 2026-11-19).
solc_version = "0.8.38"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
# Priority network for development and testing.
sepolia = "${SEPOLIA_RPC_URL}"
# Secondary target: validate portability of the same contracts on Polkadot Hub (EVM-compatible via pallet-revive/PolkaVM).
polkadot_hub_testnet = "${POLKADOT_HUB_TESTNET_RPC_URL}"
# Mainnet endpoints intentionally omitted — add once the mainnet chain decision is made.
# See docs/PROJECT_STATUS.md and docs/architecture/blockchain.md.

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
